[package]
name = "akuna-core-extraction"
authors.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "File content extraction with magika-driven type detection"

[features]
default = []
tree-sitter = ["akuna-core-chunking/tree-sitter"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
akuna-core-detection = { path = "../core-detection" }
akuna-core-chunking = { path = "../core-chunking" }
pdf_oxide = { version = "0.3.30", default-features = false }
office_oxide = { version = "0.1.2", default-features = false }
omniparse = { version = "0.4.0", default-features = false }
rbook = { version = "0.7.7", default-features = false }

[dev-dependencies]
walkdir = { workspace = true }

[lints]
workspace = true
