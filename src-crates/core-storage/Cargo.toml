grafeo = { version = "0.5.42", default-features = false, features = ["embedded", "hybrid-search", "rdf", "text-index", "vector-index"] }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = "3.27.0"

[lints]
workspace = true
